name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vint:
    name: Lint (vint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install vint
        # setuptools<81 keeps pkg_resources available, which vint imports
        # (removed from setuptools >= 81 / Python >= 3.12 defaults).
        run: pip install vim-vint "setuptools<81"
      - name: Run vint
        run: vint .

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vim (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim
      - name: Install Vim (macOS)
        if: runner.os == 'macOS'
        run: brew install vim
      - name: Install Vim (Windows)
        if: runner.os == 'Windows'
        run: winget install -e --id Vim.Vim
      - name: Run tests
        shell: bash
        run: bash scripts/test.sh

  test-vim-min:
    name: Tests (Vim 8.2, minimum supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build latest Vim 8.2 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev
          TAG=$(git ls-remote --tags https://github.com/vim/vim.git 'v8.2.*' \
            | awk -F/ '{print $3}' | sort -V | tail -1)
          echo "Building Vim $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/vim/vim.git vim-src
          cd vim-src
          ./configure --with-features=huge --disable-gui --without-x \
            --enable-multibyte --prefix="$HOME/vim82"
          make -j"$(nproc)"
          make install
      - name: Run tests with Vim 8.2
        run: VIM="$HOME/vim82/bin/vim" bash scripts/test.sh
